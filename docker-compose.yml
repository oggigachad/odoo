services:
  postgres:
    image: postgres:16
    container_name: sos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sos}
      POSTGRES_DB: ${POSTGRES_DB:-sos_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sos -d sos_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
